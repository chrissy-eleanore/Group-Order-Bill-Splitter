<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聚餐外送分帳與運費平攤小算盤</title>
  <style>
    :root {
      --primary-color: #8E9BAE;
      --primary-hover: #788598;
      --bg-color: #F4F6F9;
      --card-bg: #FFFFFF;
      --text-main: #2C3E50;
      --text-muted: #6C7A89;
      --border-color: #E2E8F0;
      --accent-color: #5A6B7C;
      --success-color: #4CAF50;
      --danger-color: #E53935;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 16px 24px;
    }

    /* 頂部 Header */
    header {
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-title img {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid var(--primary-color);
    }

    .header-title h1 {
      font-size: 1.4rem;
      color: var(--accent-color);
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    /* 按鈕樣式 */
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-outline {
      background-color: transparent;
      border: 1px solid var(--primary-color);
      color: var(--primary-color);
    }

    .btn-outline:hover {
      background-color: #EBF0F5;
    }

    .btn-danger {
      background-color: transparent;
      color: var(--danger-color);
      padding: 4px 8px;
      font-size: 0.8rem;
    }

    .btn-danger:hover {
      background-color: #FFEBEE;
    }

    .btn-block {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
    }

    /* 主 Dashboard (雙欄 No-Scroll) */
    .dashboard {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      height: calc(100vh - 92px);
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent-color);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 左欄內容 */
    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 100%;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .input-group label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    input[type="text"], input[type="number"] {
      padding: 9px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--primary-color);
    }

    .summary-card {
      background-color: #F8FAFC;
      border: 1px dashed var(--primary-color);
      border-radius: 10px;
      padding: 14px;
      margin-top: auto;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .summary-row.total {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
      font-size: 1rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    /* 右欄內容 (可滾動成員區) */
    .right-panel {
      height: 100%;
      overflow: hidden;
    }

    .members-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding-right: 6px;
      margin-top: 10px;
    }

    .members-scroll-area::-webkit-scrollbar {
      width: 6px;
    }

    .members-scroll-area::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 3px;
    }

    .member-card {
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      background-color: #FAFCFF;
    }

    .member-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .member-name-input {
      font-weight: bold;
      width: 180px;
    }

    .item-row {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
      align-items: center;
    }

    .item-row input[type="text"] {
      flex: 2;
    }

    .item-row input[type="number"] {
      flex: 1;
    }

    .member-subtotal {
      text-align: right;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .member-subtotal span {
      font-weight: bold;
      color: var(--accent-color);
    }

    /* Modal 彈窗樣式 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(2px);
    }

    .modal-card {
      background: white;
      border-radius: 16px;
      width: 90%;
      max-width: 550px;
      max-height: 85vh;
      padding: 24px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      position: relative;
      animation: modalFadeIn 0.25s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .modal-header {
      text-align: center;
      margin-bottom: 16px;
    }

    .modal-header img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 8px;
      border: 3px solid var(--primary-color);
    }

    .modal-header h2 {
      font-size: 1.25rem;
      color: var(--accent-color);
    }

    .modal-body {
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 12px;
    }

    .result-table th, .result-table td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    .result-table th {
      background-color: #F8FAFC;
      color: var(--text-muted);
    }

    .result-table td.amount {
      font-weight: bold;
      color: var(--accent-color);
    }

    .notice-box {
      background-color: #FFF9E6;
      border: 1px solid #FFE58F;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.8rem;
      color: #8C6B00;
      margin-bottom: 12px;
    }

    .line-text-area {
      width: 100%;
      height: 90px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #F8FAFC;
      font-size: 0.85rem;
      resize: none;
      margin-bottom: 10px;
    }

    /* Toast 提示 */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(44, 62, 80, 0.9);
      color: white;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: none;
      z-index: 1100;
    }
  </style>
</head>
<body>

  <!-- 頂部 Header -->
  <header>
    <div class="header-title">
      <img src="image1.webp" alt="角落生物小圖">
      <h1>🍱 聚餐外送分帳與運費平攤小算盤</h1>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline" onclick="loadDemoData()">📋 載入測試範例</button>
      <button class="btn btn-outline" onclick="resetAll()">🔄 清空重置</button>
    </div>
  </header>

  <!-- 主 Dashboard (雙欄 No-Scroll) -->
  <div class="dashboard">
    <!-- 左欄：參數與計算按鈕 -->
    <div class="card left-panel">
      <div class="card-title">1. 外送與折扣設定</div>
      
      <div class="input-group">
        <label for="deliveryFee">🛵 外送費 / 服務費 ($)</label>
        <input type="number" id="deliveryFee" value="0" min="0" oninput="updateSummary()">
      </div>

      <div class="input-group">
        <label for="discount">🎟️ 總折扣 / 優惠券 ($)</label>
        <input type="number" id="discount" value="0" min="0" oninput="updateSummary()">
      </div>

      <div class="summary-card">
        <div class="summary-row">
          <span>餐點小計</span>
          <span id="sumFood">$0</span>
        </div>
        <div class="summary-row">
          <span>運費 / 折扣淨額</span>
          <span id="sumNetFee">$0</span>
        </div>
        <div class="summary-row total">
          <span>全單實付總額</span>
          <span id="sumTotal">$0</span>
        </div>
      </div>

      <button class="btn btn-primary btn-block" style="margin-top: auto;" onclick="openCalculateModal()">🧮 開始計算分帳金額</button>
    </div>

    <!-- 右欄：成員點餐明細 -->
    <div class="card right-panel">
      <div class="card-title">
        <span>2. 各成員點餐明細</span>
        <button class="btn btn-primary" style="padding: 6px 12px; font-size: 0.85rem;" onclick="addMember()">+ 新增成員</button>
      </div>

      <div class="members-scroll-area" id="membersContainer">
        <!-- 動態插入成員卡片 -->
      </div>
    </div>
  </div>

  <!-- 分帳結果 Modal 彈窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <button class="modal-close-btn" onclick="closeModal()">✕</button>
      
      <div class="modal-header">
        <img src="image2.webp" alt="角落生物慶祝圖">
        <h2>🎉 分帳結果計算出來囉！</h2>
      </div>

      <div class="modal-body">
        <table class="result-table">
          <thead>
            <tr>
              <th>成員</th>
              <th>餐點原價</th>
              <th>分擔額</th>
              <th>最終應付</th>
            </tr>
          </thead>
          <tbody id="modalResultBody">
            <!-- 動態插入計算結果 -->
          </tbody>
        </table>

        <div class="notice-box" id="modalNoticeBox">
          💡 提示：採四捨五入計算，因尾數微調已自動修正至餐點金額最高的成員。
        </div>

        <label style="font-weight: 600; font-size: 0.85rem; color: var(--accent-color);">💬 LINE 催帳文字：</label>
        <textarea class="line-text-area" id="lineTextArea" readonly></textarea>
        
        <button class="btn btn-primary btn-block" onclick="copyLineText()">📋 一鍵複製 LINE 催帳文字</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">複製成功！已複製到剪貼簿</div>

  <script>
    let memberCount = 0;

    window.onload = function() {
      addMember();
    };

    function addMember(name = '', items = []) {
      memberCount++;
      const id = memberCount;
      const container = document.getElementById('membersContainer');

      const card = document.createElement('div');
      card.className = 'member-card';
      card.id = `member-${id}`;

      card.innerHTML = `
        <div class="member-header">
          <input type="text" class="member-name-input" placeholder="成員姓名" value="${name}" oninput="updateSummary()">
          <button class="btn btn-danger" onclick="removeMember(${id})">刪除成員</button>
        </div>
        <div id="items-container-${id}"></div>
        <button class="btn btn-outline" style="font-size: 0.8rem; padding: 3px 8px;" onclick="addItem(${id})">+ 新增品項</button>
        <div class="member-subtotal">小計: $<span id="member-subtotal-${id}">0</span></div>
      `;

      container.appendChild(card);

      if (items.length > 0) {
        items.forEach(item => addItem(id, item.name, item.price));
      } else {
        addItem(id);
      }
      updateSummary();
    }

    function removeMember(id) {
      const card = document.getElementById(`member-${id}`);
      if (card) {
        card.remove();
        updateSummary();
      }
    }

    function addItem(memberId, name = '', price = '') {
      const container = document.getElementById(`items-container-${memberId}`);
      const itemRow = document.createElement('div');
      itemRow.className = 'item-row';

      itemRow.innerHTML = `
        <input type="text" class="item-name" placeholder="品項 (例: 排骨飯)" value="${name}">
        <input type="number" class="item-price" placeholder="金額" value="${price}" min="0" oninput="updateSummary()">
        <button class="btn btn-danger" onclick="this.parentElement.remove(); updateSummary();">✕</button>
      `;

      container.appendChild(itemRow);
      updateSummary();
    }

    // 更新即時面板
    function updateSummary() {
      const deliveryFee = parseFloat(document.getElementById('deliveryFee').value) || 0;
      const discount = parseFloat(document.getElementById('discount').value) || 0;
      const netFee = deliveryFee - discount;

      let totalFoodSum = 0;
      const memberCards = document.querySelectorAll('.member-card');
      
      memberCards.forEach(card => {
        const id = card.id.split('-')[1];
        let memberFoodTotal = 0;
        const priceInputs = card.querySelectorAll('.item-price');
        priceInputs.forEach(input => {
          memberFoodTotal += parseFloat(input.value) || 0;
        });

        document.getElementById(`member-subtotal-${id}`).innerText = memberFoodTotal;
        totalFoodSum += memberFoodTotal;
      });

      const totalOrderPay = totalFoodSum + netFee;
      document.getElementById('sumFood').innerText = `$${totalFoodSum}`;
      document.getElementById('sumNetFee').innerText = `${netFee >= 0 ? '+' : ''}$${netFee}`;
      document.getElementById('sumTotal').innerText = `$${totalOrderPay}`;
    }

    // 計算分帳並開啟 Modal
    function openCalculateModal() {
      const deliveryFee = parseFloat(document.getElementById('deliveryFee').value) || 0;
      const discount = parseFloat(document.getElementById('discount').value) || 0;
      const netFee = deliveryFee - discount;

      let membersData = [];
      let totalFoodSum = 0;

      const memberCards = document.querySelectorAll('.member-card');
      memberCards.forEach(card => {
        const id = card.id.split('-')[1];
        const nameInput = card.querySelector('.member-name-input').value.trim();
        const name = nameInput || `成員 ${id}`;

        let memberFoodTotal = 0;
        const priceInputs = card.querySelectorAll('.item-price');
        priceInputs.forEach(input => {
          memberFoodTotal += parseFloat(input.value) || 0;
        });

        membersData.push({
          name: name,
          foodTotal: memberFoodTotal,
          sharedFee: 0,
          finalPay: 0
        });

        totalFoodSum += memberFoodTotal;
      });

      if (membersData.length === 0 || totalFoodSum === 0) {
        alert("請先輸入有效的成員與餐點金額！");
        return;
      }

      const totalOrderPay = totalFoodSum + netFee;

      // 四捨五入平攤
      let rawTotalCalculated = 0;
      membersData.forEach(m => {
        const ratio = m.foodTotal / totalFoodSum;
        m.sharedFee = netFee * ratio;
        m.finalPay = Math.round(m.foodTotal + m.sharedFee);
        rawTotalCalculated += m.finalPay;
      });

      // 1 元尾數微調機制
      const diff = totalOrderPay - rawTotalCalculated;
      let adjustedMemberName = "";
      if (diff !== 0 && membersData.length > 0) {
        let maxMember = membersData.reduce((max, m) => m.foodTotal > max.foodTotal ? m : max, membersData[0]);
        maxMember.finalPay += diff;
        adjustedMemberName = maxMember.name;
      }

      // 渲染 Modal 內容
      const tbody = document.getElementById('modalResultBody');
      tbody.innerHTML = '';
      let lineTextLines = [`🍱 外送分帳明細 (全單 $${totalOrderPay})`];

      membersData.forEach(m => {
        const netDiff = m.finalPay - m.foodTotal;
        const diffText = netDiff >= 0 ? `+${netDiff}` : `${netDiff}`;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${m.name}</strong></td>
          <td>$${m.foodTotal}</td>
          <td style="color: ${netDiff >= 0 ? '#E53935' : '#4CAF50'};">$${diffText}</td>
          <td class="amount">$${m.finalPay}</td>
        `;
        tbody.appendChild(tr);

        lineTextLines.push(`・${m.name}：$${m.finalPay} (餐點 $${m.foodTotal} ${diffText})`);
      });

      lineTextLines.push(`\n👉 感謝大家，再麻煩轉帳給我囉！`);
      document.getElementById('lineTextArea').value = lineTextLines.join('\n');

      const noticeBox = document.getElementById('modalNoticeBox');
      if (diff !== 0) {
        noticeBox.innerText = `💡 提示：採四捨五入計算，因尾數相差 $${diff} 元，已自動將差額微調至餐點金額最高的「${adjustedMemberName}」。`;
      } else {
        noticeBox.innerText = `💡 提示：金額採四捨五入精準平攤，全單總額與各人實付完全吻合！`;
      }

      document.getElementById('modalOverlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
    }

    function loadDemoData() {
      document.getElementById('membersContainer').innerHTML = '';
      memberCount = 0;

      document.getElementById('deliveryFee').value = 60;
      document.getElementById('discount').value = 80;

      addMember('小明', [
        { name: '排骨便當', price: 120 },
        { name: '珍珠奶茶', price: 60 }
      ]);

      addMember('小華', [
        { name: '雞腿便當', price: 130 }
      ]);

      addMember('阿美', [
        { name: '牛肉麵', price: 180 },
        { name: '燙青菜', price: 40 }
      ]);
    }

    function resetAll() {
      document.getElementById('membersContainer').innerHTML = '';
      document.getElementById('deliveryFee').value = 0;
      document.getElementById('discount').value = 0;
      memberCount = 0;
      addMember();
    }

    function copyLineText() {
      const textArea = document.getElementById('lineTextArea');
      textArea.select();
      document.execCommand('copy');

      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 2000);
    }
  </script>
</body>
</html>
